name: Build Android APK with Auto Icon

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate Android App Icons
        run: |
          python3 << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          candidates = [
              'app/src/main/assets/www/icon.png',
              'www/icon.png',
              'www/icon.jpg',
              'www/icon.jpeg',
              'www/icon.webp',
              'public/icon.png'
          ]

          icon_path = None
          for path in candidates:
              if os.path.exists(path):
                  icon_path = path
                  break

          img = None

          if icon_path:
              try:
                  print(f'found icon: {icon_path}')
                  raw_img = Image.open(icon_path).convert('RGBA')
                  w, h = raw_img.size
                  max_size = max(w, h)
                  square_img = Image.new('RGBA', (max_size, max_size), (0, 0, 0, 0))
                  offset = ((max_size - w) // 2, (max_size - h) // 2)
                  square_img.paste(raw_img, offset)
                  img = square_img
                  print(f'converted {w}x{h} -> {max_size}x{max_size}')
              except Exception as e:
                  print(f'image fail: {e}')

          if img is None:
              print('generating default icon')
              img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.ellipse([32, 32, 480, 480], fill=(225, 6, 0, 255))

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          res_dir = 'app/src/main/res'

          for folder, size in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))

          print('all icons generated')
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Build
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check APK exists
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK build success"
            ls -la app/build/outputs/apk/debug/
          else
            echo "APK not found"
            find app/build -name "*.apk" 2>/dev/null || echo "no apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaDash-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 3
