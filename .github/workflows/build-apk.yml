name: Build Android APK (Signed Release)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set Auto Versioning
        run: |
          RUN_OFFSET=$(( ${{ github.run_number }} - 1 ))
          VERSION_NAME=$(printf "1.%03d" $RUN_OFFSET)
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "📌 Auto Versioning: Name=$VERSION_NAME, Code=$VERSION_CODE"

          if [ -f "app/build.gradle" ]; then
            sed -i "s/versionCode .*/versionCode $VERSION_CODE/" app/build.gradle
            sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" app/build.gradle
          elif [ -f "app/build.gradle.kts" ]; then
            sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" app/build.gradle.kts
            sed -i "s/versionName = .*/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          fi

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate Android App Icons
        run: |
          python -c "
          import os
          from PIL import Image, ImageDraw
          candidates = [
              'app/src/main/assets/www/icon.png',
              'www/icon.png', 'www/icon.jpg', 'public/icon.png'
          ]
          icon_path = None
          for path in candidates:
              if os.path.exists(path):
                  icon_path = path
                  break
          img = None
          if icon_path:
              try:
                  raw_img = Image.open(icon_path).convert('RGBA')
                  w, h = raw_img.size
                  max_size = max(w, h)
                  square_img = Image.new('RGBA', (max_size, max_size), (0, 0, 0, 0))
                  square_img.paste(raw_img, ((max_size - w) // 2, (max_size - h) // 2))
                  img = square_img
              except Exception as e:
                  print(f'icon fail: {e}')
          if img is None:
              img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.ellipse([32, 32, 480, 480], fill=(225, 6, 0, 255))
          sizes = {
              'mipmap-mdpi': 48, 'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192
          }
          for folder, size in sizes.items():
              target_dir = os.path.join('app/src/main/res', folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
          print('Icons generated')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Build
        run: ./gradlew clean

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEXTRA_CLIENT_ID: ${{ secrets.TEXTRA_CLIENT_ID }}
          TEXTRA_CLIENT_SECRET: ${{ secrets.TEXTRA_CLIENT_SECRET }}
          TEXTRA_NAME: ${{ secrets.TEXTRA_NAME }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Decode Keystore
        run: |
          echo "Base64 length: $(printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | wc -c)"
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \n\r\t' | base64 -d > release.p12
          SIZE=$(wc -c < release.p12)
          echo "release.p12 size: $SIZE bytes (expect ~2748)"
          if [ "$SIZE" -lt 1000 ]; then
            echo "❌ keystore 손상됨 (${SIZE} bytes)"
            exit 1
          fi
          ls -la release.p12
          openssl pkcs12 -info -in release.p12 -passin pass:"${{ secrets.KEYSTORE_PASSWORD }}" -noout 2>&1 | head -3 || true

      - name: Sign APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          OUTPUT_APK="app/build/outputs/apk/release/MyPlayer-${{ env.VERSION_NAME }}.apk"
          echo "Unsigned: $UNSIGNED_APK"
          echo "Output: $OUTPUT_APK"
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$OUTPUT_APK" \
            "$UNSIGNED_APK"
          echo "✅ Signed: $OUTPUT_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPlayer-v${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/MyPlayer-*.apk
          retention-days: 30
